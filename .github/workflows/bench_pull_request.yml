name: benchmark pull requests

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  runBenchmark:
    name: run benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: boa-dev/criterion-compare-action@v3.2.4
        with:
          branchName: ${{ github.base_ref }}
